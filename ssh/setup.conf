# setup.conf — the portable half of the SSH client config, tracked in this repo.
#
# Pulled in by ~/.ssh/config via an `Include config.d/*.conf` line that
# lib/identity.sh puts on the FIRST line of that file. Both halves of that
# matter, and neither is obvious:
#
#   Included, not appended directly, because an Include is evaluated inside
#   whatever Host block is in scope where it appears. At the bottom of a file
#   ending in a `Host myserver` block it would apply to myserver alone — ssh
#   logs the rest as "parse only" — so it has to sit above every Host block to
#   be global.
#
#   First line, because ssh keeps the FIRST value it obtains for a keyword and
#   ignores every later one. That is the opposite of zsh, where the last
#   definition of an alias wins.
#
# The consequence is worth being clear about: what this file sets, it sets for
# every host, and a later block in ~/.ssh/config cannot take it back. To
# override one of these for a specific host, put that Host block ABOVE the
# Include line. (IdentityFile is the exception — it accumulates rather than
# being overwritten, so extra keys elsewhere are additive, with this one tried
# first.)
#
# Symlinked to ~/.ssh/config.d/setup.conf, so edits here are live immediately.

Host *
  # Load the key into the agent on first use, so it isn't re-read per connection.
  AddKeysToAgent yes
  # Take the passphrase from the macOS keychain. Together with the
  # `ssh-add --apple-use-keychain` in lib/identity.sh, this is what makes a
  # passphrase-protected key something you type once, ever — including across
  # reboots, which a bare ssh-agent does not survive. Apple's ssh only.
  UseKeychain yes
  IdentityFile ~/.ssh/id_ed25519
